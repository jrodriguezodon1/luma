<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/luma-icon.png" />

    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Luma - Smart Wake & Sleep Controller" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
